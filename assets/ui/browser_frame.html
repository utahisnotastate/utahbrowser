<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Utah Browser</title>
  <link rel="stylesheet" href="utah.css" />
  <link rel="stylesheet" href="mockup.css" />
  <link rel="stylesheet" href="browser.css" />
  <link rel="stylesheet" href="fluidic.css" />
  <style>
    html, body.utah-frame-root {
      margin: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--utah-bg, #03060c);
    }
    .utah-browser-chrome { flex: 0 0 auto; }
    #utah-content-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #0a0e14;
    }
    .utah-frame-app-link {
      margin-left: auto;
      font-size: 0.75rem;
      opacity: 0.85;
    }
  </style>
</head>
<body class="utah-frame-root utah-mode-web ghost-chrome fluidic-container">
  <header class="utah-browser-chrome" role="banner">
    <button type="button" class="chrome-menu-btn" id="chrome-menu-btn" title="Menu" aria-label="Menu">☰</button>
    <div class="chrome-brand">
      <span class="brand-mark">UT</span>
      <span class="brand-name">Utah</span>
    </div>
    <div class="chrome-tabs-wrap">
      <div id="tab-strip" class="utah-tabs" role="tablist"></div>
      <button type="button" id="tab-new" class="utah-tab utah-tab-new" title="New tab">+</button>
    </div>
    <nav class="chrome-nav" aria-label="Navigation">
      <button type="button" id="nav-back" class="tb-btn" title="Back">←</button>
      <button type="button" id="nav-forward" class="tb-btn" title="Forward">→</button>
      <button type="button" id="nav-reload" class="tb-btn" title="Reload">↻</button>
      <button type="button" id="nav-go-home" class="tb-btn" title="Home">⌂</button>
    </nav>
    <form class="chrome-url" id="url-form" action="utah://localhost/navigate" method="get">
      <span class="url-shield" aria-hidden="true">⛨</span>
      <input id="url" name="url" type="text" class="utah-url" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
      <button type="submit" class="tb-btn tb-go">Go</button>
    </form>
    <div class="chrome-actions">
      <button type="button" id="bookmark-add" class="tb-btn" title="Bookmark">★</button>
      <button type="button" class="tb-btn" data-goto-app title="Dashboard">◈</button>
    </div>
    <div id="bookmark-bar" class="chrome-bookmarks" role="toolbar" aria-label="Bookmarks"></div>
  </header>
  <iframe
    id="utah-content-frame"
    title="Web content"
    src="about:blank"
    allow="fullscreen; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script src="fluidic-paint.js"></script>
  <script src="compositor.js"></script>
  <script src="intent-resolver.js"></script>
  <script src="chrome-drag.js"></script>
  <script src="transport.js"></script>
  <script src="browser.js"></script>
  <script src="sensory-theme.js"></script>
</body>
</html>
