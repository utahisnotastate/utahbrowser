# Utah Browser — local-only configuration (no telemetry, no cloud APIs)

[knowledge]
# Notebook corpus for Truth Engine (override with UTAH_KNOWLEDGE_PATH)
path = "C:/code/utahisnotastate"
extensions = ["md", "txt", "markdown", "pdf"]

[ollama]
host = "http://127.0.0.1:11434"
embed_model = "nomic-embed-text"
chat_model = "llama3.2"
timeout_secs = 120

[qdrant]
url = "http://127.0.0.1:6333"
collection = "utah_notebooks"
vector_size = 768

[truth]
# Cosine similarity below this threshold flags a discrepancy
similarity_threshold = 0.72
chunk_chars = 800
chunk_overlap = 120
max_context_chunks = 6

[audio]
enabled = false
sample_rate_hint = 16000

[evolution]
# Off by default — Sentinel-Core starts daemons only after shell.ready + 5s grace.
# Proposals and evolution.log live under %APPDATA%/UtahBrowser (never dist/).
enabled = false
watch_paths = ["src"]
debounce_ms = 5000
proposals_dir = "evolution/proposals"

[ui]
start_url = "https://www.google.com"
window_title = "Utah Browser // V1.0-GENESIS // OMEGA-23"

[browser]
bookmarks_collection = "utah_bookmarks"
suspend_on_switch = true
prefetch_enabled = true
prefetch_buffer_max_mb = 8

[ghost_link]
enabled = false
entropy_threshold = 0.12
frame_interval_ms = 500
buffer_seconds = 5.0
vision_model = "llava"

[urm]
enabled = true
poll_hz = 10.0
snapshot_interval_sec = 60.0
